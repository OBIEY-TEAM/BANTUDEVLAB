    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - GEMMA_MODEL=gemma2:2b
    networks:
      - backend_net
    <<: *hardening

  # Ordonnanceur periodique Celery Beat (T-DEV-502, T-DEV-503, T-DEV-504)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery_beat
    restart: always
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment:
      <<: *django-env
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *hardening
    networks:
      - backend_net

volumes:
      - gitea_data:/data
    entrypoint:
      - "sh"
      - "-c"
      - |
        sleep 2
        gitea --work-path /data admin user create --username bantu_admin --password BantuAdmin2026! --email admin@bantudevlab.africa --admin 2>/dev/null || true
        echo "Gitea admin user ready."
    networks:
      - sovereign_net
      - backend_net

  # Portail Central BantuDevLab (port hote 8001)
  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_core
    restart: always
    environment:
      <<: *django-env
      WEB_CONCURRENCY: "4"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *hardening
    networks:
      - sovereign_net
      - backend_net

  # Moteur Forge Git Souveraine (port hote 3001)
  forge_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_forge
    restart: always
    command: ["python", "forge_server.py"]
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      BANTU_CORE_URL: "http://localhost:8001"
      BANTU_CORE_INTERNAL_URL: "http://django_app:8000"
      GITEA_EXTERNAL_URL: "http://localhost:3002"
      GITEA_LOGIN_URL: "http://localhost:3002/user/login"
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:-bantu_dev_webhook_secret_key_2026}
