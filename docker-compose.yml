x-django-env: &django-env
  DEBUG: ${DEBUG:-True}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-bantu_dev_secret_key_9f8e7d6c5b4a3210_cadev2026_sovereign_africa}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001}
  SECURE_SSL_REDIRECT: "False"
  DB_ENGINE: postgres
  POSTGRES_DB: ${POSTGRES_DB:-bantudevlab}
  POSTGRES_USER: ${POSTGRES_USER:-bantudevlab_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sovereign_pass_2025}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  GITEA_API_URL: http://gitea:3000/api/v1
  GITEA_EXTERNAL_URL: ${GITEA_EXTERNAL_URL:-http://localhost:3002}
  GITEA_LOGIN_URL: ${GITEA_LOGIN_URL:-http://localhost:3002/user/login}
  GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN:-1749a33d29fee921385f891d05e6cc2aa5fa97f2}
  GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:-bantu_dev_webhook_secret_key_2026}
  GITLAB_URL: ${GITLAB_URL:-http://localhost:3001}
  GEMMA_API_URL: ${GEMMA_API_URL:-http://ollama:11434/api/generate}
  GEMMA_MODEL_NAME: ${GEMMA_MODEL_NAME:-gemma2:2b}
  REDIS_URL: redis://:${REDIS_PASSWORD:-sovereign_redis_pass_2025}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-sovereign_redis_pass_2025}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-sovereign_redis_pass_2025}@redis:6379/0

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # Base de donnees PostgreSQL souveraine
  db:
    image: postgres:16-alpine
    container_name: bantudevlab_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bantudevlab}
      POSTGRES_USER: ${POSTGRES_USER:-bantudevlab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sovereign_pass_2025}
      # Moteur d'Inference IA Locale Ollama (Gemma 2 2B) - T-OPS-501 & T-OPS-503
  ollama:
    image: ollama/ollama:latest
    container_name: bantudevlab_ollama
    restart: always
    volumes:
      - ollama_models:/root/.ollama
      - ./deploy/ai/start_gemma_engine.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - GEMMA_MODEL=gemma2:2b
    networks:
      - backend_net
    <<: *hardening

  # Ordonnanceur periodique Celery Beat (T-DEV-502, T-DEV-503, T-DEV-504)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery_beat
    restart: always
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment:
      <<: *django-env
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *hardening
    networks:
      - backend_net

volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Broker Redis & Cache
  redis:
    image: redis:7-alpine
    container_name: bantudevlab_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-sovereign_redis_pass_2025}"]
      # Moteur d'Inference IA Locale Ollama (Gemma 2 2B) - T-OPS-501 & T-OPS-503
  ollama:
    image: ollama/ollama:latest
    container_name: bantudevlab_ollama
    restart: always
    volumes:
      - ollama_models:/root/.ollama
      - ./deploy/ai/start_gemma_engine.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - GEMMA_MODEL=gemma2:2b
    networks:
      - backend_net
    <<: *hardening

  # Ordonnanceur periodique Celery Beat (T-DEV-502, T-DEV-503, T-DEV-504)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery_beat
    restart: always
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment:
      <<: *django-env
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *hardening
    networks:
      - backend_net

volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sovereign_redis_pass_2025}
    <<: *hardening
    networks:
      - backend_net

  # Moteur Git Officiel Gitea (port hote 3002)
  gitea:
    image: gitea/gitea:1.22
    container_name: bantudevlab_gitea
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${POSTGRES_DB:-bantudevlab}
      - GITEA__database__USER=${POSTGRES_USER:-bantudevlab_admin}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:-sovereign_pass_2025}
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3002/
      - GITEA__server__LANDING_PAGE=explore
      - GITEA__server__SSH_PORT=2222
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=bantu_gitea_secret_key_2026_sovereign_africa
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__ENABLE_CAPTCHA=false
      - GITEA__webhook__ALLOWED_HOST_LIST=django_app,forge_engine,127.0.0.1,localhost,host.docker.internal
      # Moteur d'Inference IA Locale Ollama (Gemma 2 2B) - T-OPS-501 & T-OPS-503
  ollama:
    image: ollama/ollama:latest
    container_name: bantudevlab_ollama
    restart: always
    volumes:
      - ollama_models:/root/.ollama
      - ./deploy/ai/start_gemma_engine.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - GEMMA_MODEL=gemma2:2b
    networks:
      - backend_net
    <<: *hardening

  # Ordonnanceur periodique Celery Beat (T-DEV-502, T-DEV-503, T-DEV-504)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery_beat
    restart: always
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment:
      <<: *django-env
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *hardening
    networks:
      - backend_net

volumes:
      - gitea_data:/data
    ports:
      - "3002:3000"
      - "2222:2222"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
