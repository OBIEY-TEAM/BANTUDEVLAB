x-django-env: &django-env
  DEBUG: ${DEBUG:-False}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY est obligatoire (voir .env.example)}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  DB_ENGINE: postgres
  POSTGRES_DB: ${POSTGRES_DB:-bantudevlab}
  POSTGRES_USER: ${POSTGRES_USER:-bantudevlab_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  GITEA_API_URL: http://gitea:3000/api/v1
  GITEA_EXTERNAL_URL: ${GITEA_EXTERNAL_URL:-http://localhost:3000}
  GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:?GITEA_WEBHOOK_SECRET est obligatoire}
  GEMMA_API_URL: ${GEMMA_API_URL:-http://host.docker.internal:11434/api/generate}
  GEMMA_MODEL_NAME: ${GEMMA_MODEL_NAME:-gemma:5b}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Broker de messages & cache distribue souverain (Redis) - reseau interne uniquement (SEC-053)
  redis:
    image: redis:7-alpine
    container_name: bantudevlab_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    <<: *hardening
    networks:
      - backend_net

  # Base de donnees relationnelle souveraine - reseau interne uniquement (SEC-053)
  db:
    image: postgres:16-alpine
    container_name: bantudevlab_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bantudevlab}
      POSTGRES_USER: ${POSTGRES_USER:-bantudevlab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Moteur de gestion de versions open-source (Gitea)
  gitea:
    image: gitea/gitea:1.23-rootless
    container_name: bantudevlab_gitea
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${POSTGRES_DB:-bantudevlab}
      - GITEA__database__USER=${POSTGRES_USER:-bantudevlab_admin}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__ROOT_URL=${GITEA_EXTERNAL_URL:-http://localhost:3000}/
      - GITEA__security__INSTALL_LOCK=true
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:2222"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - sovereign_net
      - backend_net

  # Surcouche souveraine Django (BantuDevLab Core + ZKP + Gemma 5B + Security Scanner)
  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_core
    restart: always
    environment:
      <<: *django-env
      WEB_CONCURRENCY: "4"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *hardening
    networks:
      - sovereign_net
      - backend_net

  # File de taches asynchrones Celery Worker (PERF-01)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=4
    environment:
      <<: *django-env
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *hardening
    networks:
      - sovereign_net
      - backend_net

volumes:
  postgres_data:
  gitea_data:
  redis_data:

networks:
  sovereign_net:
    driver: bridge
  # Reseau interne : PostgreSQL et Redis ne sont joignables ni depuis l'hote ni depuis Internet
  backend_net:
    driver: bridge
    internal: true
