# BANTUDEVLAB — Composition de Production Industrielle Durcie (Portail Django + Gitea + Forge + GitLab CE Omnibus)
# T-DOC-401 & T-DOC-402: Déploiement souverain, isolation réseau 3 tiers, rootless, read-only et PgBouncer

x-django-env: &django-env
  DEBUG: "False"
  XDG_RUNTIME_DIR: /tmp
  DB_ENGINE: postgres
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  GITEA_API_URL: http://gitea:3000/api/v1
  GITEA_WEB_URL: https://git.cybersocle.site
  GITEA_EXTERNAL_URL: https://git.cybersocle.site
  GITEA_LOGIN_URL: https://git.cybersocle.site/user/login
  GEMMA_API_URL: ${GEMMA_API_URL:-http://ollama:11434/api/generate}
  GEMMA_MODEL_NAME: ${GEMMA_MODEL_NAME:-gemma2:2b}

x-hardening-rootless: &hardening-rootless
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  # Reverse Proxy Nginx durci avec terminaison TLS 1.3
  nginx:
    image: nginx:1.27-alpine
    container_name: bantudevlab_nginx
    restart: always
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/nginx/bantudevlab.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - django_app
      - gitea
      - forge_engine
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net
      - app_net

  # GitLab CE Omnibus Officiel Durci
  gitlab:
    image: gitlab/gitlab-ce:16.11.0-ce.0
    container_name: bantudevlab_gitlab_ce
    restart: always
    shm_size: "512m"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        from_file('/etc/gitlab/gitlab.rb')
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET}
    volumes:
      - ./gitlab/config/gitlab.rb:/etc/gitlab/gitlab.rb:ro
      - ./gitlab/config/initializers/bantu_zkp.rb:/opt/gitlab/embedded/service/gitlab-rails/config/initializers/bantu_zkp.rb:ro
      - ./gitlab/lib/gitlab/auth/bantu_zkp.rb:/opt/gitlab/embedded/service/gitlab-rails/lib/gitlab/auth/bantu_zkp.rb:ro
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    ports:
      - "2222:22"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  # Moteur Git Officiel Gitea rattaché à https://git.cybersocle.site/ (port hôte 3002 -> conteneur 3000)
  gitea:
    image: gitea/gitea:1.22
    container_name: bantudevlab_gitea_prod
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__database__SQLITE_JOURNAL_MODE=WAL
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-git.cybersocle.site}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL:-https://git.cybersocle.site/}
      - GITEA__server__LANDING_PAGE=explore
      - GITEA__server__SSH_PORT=2222
      - GITEA__ui__DEFAULT_THEME=github-dark
      - GITEA__ui__THEMES=gitea-auto,gitea-light,gitea-dark,github,github-dark
      - GITEA__i18n__LANGS=fr-FR,en-US,sw-KE,pt-PT
      - GITEA__i18n__NAMES=Français,English,Kiswahili,Português
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=bantu_gitea_secret_key_2026_sovereign_africa
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__ENABLE_CAPTCHA=false
      - GITEA__webhook__ALLOWED_HOST_LIST=django_app,forge_engine,127.0.0.1,localhost,host.docker.internal,cybersocle.site,git.cybersocle.site
    volumes:
      - gitea_production_data:/data
      - ./custom:/data/gitea/custom:ro
      - ./custom/templates:/data/gitea/templates:ro
      - ./custom/public:/data/gitea/public:ro
      - ./forge_data/repos:/data/git/repositories
    ports:
      - "3002:3000"
      - "2223:2222"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
      - backend_net

  # Initialisation securisee des comptes Gitea via variables d'environnement
  gitea_init:
    image: gitea/gitea:1.22
    container_name: bantudevlab_gitea_init_prod
    restart: "no"
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - gitea_production_data:/data
    entrypoint:
      - "sh"
      - "-c"
      - |
        sleep 2
        if [ -n "$$GITEA_ADMIN_USER" ] && [ -n "$$GITEA_ADMIN_PASSWORD" ]; then
          su-exec git gitea --work-path /data/gitea admin user create --username "$$GITEA_ADMIN_USER" --password "$$GITEA_ADMIN_PASSWORD" --email "$${GITEA_ADMIN_EMAIL:-admin@bantudevlab.africa}" --admin --must-change-password=false 2>/dev/null || true
          su-exec git gitea --work-path /data/gitea admin user change-password --username "$$GITEA_ADMIN_USER" --password "$$GITEA_ADMIN_PASSWORD" --must-change-password=false 2>/dev/null || true
        fi
        # Compte de demonstration evaluateur CADEV 2026 (utilisateur standard sans droits admin)
        su-exec git gitea --work-path /data/gitea admin user create --username cadev_evaluator --password "$${DEMO_USER_PASSWORD:-DemoCadev2026!}" --email evaluator@cadev2026.africa --must-change-password=false 2>/dev/null || true
        echo "Comptes Gitea prets."
    networks:
      - app_net
      - backend_net

  # Moteur Forge Git Souveraine (port hôte 3001)
  forge_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_forge_prod
    restart: always
    command: ["python", "forge_server.py"]
    ports:
      - "3001:3001"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      PORT: "3001"
      BANTU_CORE_URL: ${BASE_URL_1:-https://cybersocle.site}
      BANTU_CORE_INTERNAL_URL: "http://django_app:8000"
      GITEA_EXTERNAL_URL: https://git.cybersocle.site
      GITEA_LOGIN_URL: https://git.cybersocle.site/user/login
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:-bantu_dev_webhook_secret_key_2026}
    volumes:
      - forge_production_repos:/app/forge_data/repos
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
      - backend_net

  # Surcouche Souveraine Django BantuDevLab Core (ports hôtes 8000, 8001, 8002 -> interne 8000)
  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_django_prod
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      <<: *django-env
      WEB_CONCURRENCY: "4"
    ports:
      - "127.0.0.1:8000:8000"
      - "8001:8000"
      - "8002:8000"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    <<: *hardening-rootless
    networks:
      - app_net
      - backend_net

  # File de tâches asynchrones Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery_prod
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      <<: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *hardening-rootless
    networks:
      - backend_net

  # Ordonnanceur periodique Celery Beat de production (T-DEV-502, T-DEV-503, T-DEV-504)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery_beat_prod
    restart: always
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "-s", "/tmp/celerybeat-schedule"]
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      <<: *django-env
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Pooler de Connexions PgBouncer Haute Disponibilité (T-DOC-403)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bantudevlab_pgbouncer
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      LISTEN_ADDR: "0.0.0.0"
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "50"
    entrypoint:
      - "sh"
      - "-c"
      - |
        printf '"%s" "%s"\n' "$${POSTGRES_USER:-bantudevlab_admin}" "$${POSTGRES_PASSWORD:-sovereign_pass_2025}" > /tmp/userlist.txt
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Base de données PostgreSQL 16 Durcie
  db:
    image: postgres:16-alpine
    container_name: bantudevlab_postgres_prod
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bantudevlab_admin} -d $${POSTGRES_DB:-bantudevlab_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Cache Valkey sécurisé (Remplacement permissif BSD-3 de Redis pour CADEV 2026) & Broker Celery
  redis:
    image: valkey/valkey:7.2-alpine
    container_name: bantudevlab_redis_prod
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    command: ["sh", "-c", "valkey-server --requirepass \"$${REDIS_PASSWORD:-sovereign_redis_pass_2025}\" --appendonly yes"]
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${REDIS_PASSWORD:-sovereign_redis_pass_2025}\" ping | grep PONG || redis-cli -a \"$${REDIS_PASSWORD:-sovereign_redis_pass_2025}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Service Inference LLM Ollama (Gemma 2 2B) - Isolation stricte backend_net (T-OPS-501 & T-OPS-503)
  ollama:
    image: ollama/ollama:latest
    container_name: bantudevlab_ollama_prod
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ollama_production_models:/root/.ollama
      - ./deploy/ai/start_gemma_engine.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - GEMMA_MODEL=gemma2:2b
    networks:
      - backend_net
      - app_net
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_production_data:
  redis_production_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitea_production_data:
  forge_production_repos:
  static_volume:
  ollama_production_models:

networks:
  # Réseau 1 : Exposition Internet publique via Nginx
  frontend_net:
    driver: bridge
  # Réseau 2 : Couche applicative interne (Nginx <-> Django, GitLab, Gitea, Forge)
  app_net:
    driver: bridge
  # Réseau 3 : Couche données isolée sans accès sortant (Postgres, Redis, PgBouncer)
  backend_net:
    driver: bridge
    internal: true
