# BANTUDEVLAB — Composition de Production Industrielle Durcie avec GitLab CE Omnibus
# T-DOC-401 & T-DOC-402: Déploiement souverain, isolation réseau 3 tiers, rootless, read-only et PgBouncer

x-django-env: &django-env
  DEBUG: "False"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  XDG_RUNTIME_DIR: /tmp
  BASE_URL_1: ${BASE_URL_1:-https://cybersocle.site}
  BASE_URL_2: ${BASE_URL_2:-https://git.cybersocle.site}
  BASE_URL_3: ${BASE_URL_3:-https://api.cybersocle.site}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-cybersocle.site,git.cybersocle.site,api.cybersocle.site,git.bantudevlab.africa,auth.bantudevlab.africa,localhost,127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://cybersocle.site,https://git.cybersocle.site,https://api.cybersocle.site}
  SECURE_SSL_REDIRECT: "True"
  DB_ENGINE: postgres
  POSTGRES_DB: ${POSTGRES_DB:-bantudevlab_prod}
  POSTGRES_USER: ${POSTGRES_USER:-bantudevlab_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  GITLAB_URL: ${GITLAB_URL:-https://cybersocle.site}
  GITLAB_PRIVATE_TOKEN: ${GITLAB_PRIVATE_TOKEN:-}
  GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  GEMMA_API_URL: ${GEMMA_API_URL:-http://ollama:11434/api/generate}
  GEMMA_MODEL_NAME: ${GEMMA_MODEL_NAME:-gemma2:2b}

x-hardening-rootless: &hardening-rootless
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  # Reverse Proxy Nginx durci avec terminaison TLS 1.3
  nginx:
    image: nginx:1.27-alpine
    container_name: bantudevlab_nginx
    restart: always
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/nginx/bantudevlab.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - django_app
      - gitlab
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net
      - app_net

  # GitLab CE Omnibus Officiel Durci
  gitlab:
    image: gitlab/gitlab-ce:16.11.0-ce.0
    container_name: bantudevlab_gitlab_ce
    restart: always
    shm_size: "512m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        from_file('/etc/gitlab/gitlab.rb')
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET}
    volumes:
      - ./gitlab/config/gitlab.rb:/etc/gitlab/gitlab.rb:ro
      - ./gitlab/config/initializers/bantu_zkp.rb:/opt/gitlab/embedded/service/gitlab-rails/config/initializers/bantu_zkp.rb:ro
      - ./gitlab/lib/gitlab/auth/bantu_zkp.rb:/opt/gitlab/embedded/service/gitlab-rails/lib/gitlab/auth/bantu_zkp.rb:ro
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    ports:
      - "2222:22"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  # Surcouche Souveraine Django BantuDevLab Core
  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_django_prod
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      <<: *django-env
      WEB_CONCURRENCY: "8"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    <<: *hardening-rootless
    networks:
      - app_net
      - backend_net

  # File de tâches asynchrones Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery_prod
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=8
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      <<: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *hardening-rootless
    networks:
      - backend_net

  # Ordonnanceur periodique Celery Beat de production (T-DEV-502, T-DEV-503, T-DEV-504)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantudevlab_celery_beat_prod
    restart: always
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      <<: *django-env
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Pooler de Connexions PgBouncer Haute Disponibilité (T-DOC-403)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bantudevlab_pgbouncer
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DB_USER: ${POSTGRES_USER:-bantudevlab_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-bantudevlab_prod}
      LISTEN_ADDR: "0.0.0.0"
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "50"
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Base de données PostgreSQL 16 Durcie
  db:
    image: postgres:16-alpine
    container_name: bantudevlab_postgres_prod
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bantudevlab_prod}
      POSTGRES_USER: ${POSTGRES_USER:-bantudevlab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Cache Redis sécurisé & Broker Celery
  redis:
    image: redis:7-alpine
    container_name: bantudevlab_redis_prod
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # Service Inference LLM Ollama (Gemma 2 2B) - Isolation stricte backend_net (T-OPS-501 & T-OPS-503)
  ollama:
    image: ollama/ollama:latest
    container_name: bantudevlab_ollama_prod
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ollama_production_models:/root/.ollama
      - ./deploy/ai/start_gemma_engine.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - GEMMA_MODEL=gemma2:2b
    networks:
      - backend_net
      - app_net
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_production_data:
  redis_production_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  static_volume:
  ollama_production_models:

networks:
  # Réseau 1 : Exposition Internet publique via Nginx
  frontend_net:
    driver: bridge
  # Réseau 2 : Couche applicative interne (Nginx <-> Django, GitLab)
  app_net:
    driver: bridge
  # Réseau 3 : Couche données isolée sans accès sortant (Postgres, Redis, PgBouncer)
  backend_net:
    driver: bridge
    internal: true
