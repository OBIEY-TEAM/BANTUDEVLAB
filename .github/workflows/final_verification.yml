name: Sovereign Final Verification & Parity CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "docs/SOVEREIGN_GITHUB_FORGE_COMPLETE_REVIEW.md"
      - "apps/ai_assistant/**"
      - "tests/test_ai_assistant.py"
      - ".github/workflows/final_verification.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  final-verification:
    name: Full Sovereign Forge & AI Assistant Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BantuDevLab Environment
        uses: ./.github/actions/setup-bantudevlab
        with:
          python-version: "3.11"
      - name: Test Copilot Session Export
        run: |
          pytest tests/test_ai_assistant.py -k "test_copilot_session_export" -v -o addopts=""
