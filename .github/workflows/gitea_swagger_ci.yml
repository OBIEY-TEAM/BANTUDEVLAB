name: Gitea Swagger OpenAPI & Sovereign Integration CI

on:
  push:
    branches: [develop-jule, main]
  pull_request:
    branches: [develop-jule, main]

jobs:
  swagger-compliance:
    name: Gitea Swagger API Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-django requests

      - name: Check Zero Emoji Rule
        run: |
          python scripts/check_no_emoji.py

      - name: Execute Gitea Swagger OpenAPI Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-key-sovereign-github-swagger
        run: |
          pytest tests/test_gitea_swagger_api.py tests/test_gitea_client.py -o addopts=""
