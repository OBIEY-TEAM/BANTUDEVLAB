name: Sovereign Accessible Reactions & Shortcodes CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "custom/public/assets/css/**"
      - "custom/templates/custom/**"
      - ".github/workflows/reactions_polyfill.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  reactions-verify:
    name: Verify Accessible Reactions & Emoji Polyfill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django celery python-dotenv drf-spectacular

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Reaction Polyfill Components
        run: |
          pytest tests/test_design_and_ux.py -k "reactions_and_shortcodes" -v -o addopts=""
