name: Sovereign Profile & Pinned Repositories CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "custom/public/assets/css/**"
      - "custom/templates/custom/**"
      - ".github/workflows/profile_presentation.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  profile-verify:
    name: Verify Profile README & Pinned Repo Cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup BantuDevLab Environment
        uses: ./.github/actions/setup-bantudevlab
        with:
          python-version: "3.11"
      - name: Test Profile Presentation Components
        run: |
          pytest tests/test_ui_axes.py -k "pinned_repos" -v -o addopts=""
