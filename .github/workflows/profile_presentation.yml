name: Sovereign Profile & Pinned Repositories CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "custom/public/assets/css/**"
      - "custom/templates/custom/**"
      - ".github/workflows/profile_presentation.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  profile-verify:
    name: Verify Profile README & Pinned Repo Cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django celery python-dotenv

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Profile Presentation Components
        run: |
          pytest tests/test_ui_axes.py -k "pinned_repos" -v -o addopts=""
