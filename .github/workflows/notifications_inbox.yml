name: Sovereign Notifications Inbox CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "custom/public/assets/css/**"
      - "custom/templates/custom/header.tmpl"
      - "tests/test_ui_axes.py"
      - ".github/workflows/notifications_inbox.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  notifications-verify:
    name: Verify Notifications Inbox Styles & Filtering
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Notifications Inbox
        run: |
          pytest tests/test_ui_axes.py -k "test_t_ntf_1601_and_1602_notifications_inbox_and_filter_tabs" -v -o addopts=""
