name: Sovereign Copilot & AI Code Intelligence Verification

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "apps/ai_assistant/**"
      - "tests/test_ai_assistant.py"
      - ".github/workflows/copilot_verification.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  copilot-test:
    name: Verify Sovereign Copilot Endpoints & Gemma Fallback
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django celery python-dotenv drf-spectacular

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Execute Copilot AI Tests
        run: |
          pytest tests/test_ai_assistant.py -v -o addopts=""
