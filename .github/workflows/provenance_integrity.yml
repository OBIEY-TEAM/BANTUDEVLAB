name: Sovereign Release Provenance & Integrity CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "scripts/generate_release_provenance.py"
      - "docs/SOVEREIGN_RELEASE_INTEGRITY.md"
      - ".github/workflows/provenance_integrity.yml"
  release:
    types: [published]

jobs:
  provenance-verify:
    name: Attestation and SHA256 Integrity Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup BantuDevLab Environment
        uses: ./.github/actions/setup-bantudevlab
        with:
          python-version: "3.11"
      - name: Test Release Provenance Generator
        run: |
          pytest tests/test_sec_axes.py -k "release_provenance" -v -o addopts=""
