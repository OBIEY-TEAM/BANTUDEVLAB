name: Sovereign Release Notes Generator CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "scripts/generate_release_notes.py"
      - "docs/SOVEREIGN_RELEASE_NOTES.md"
      - ".github/release.yml"
      - ".gitea/release.yml"
      - "tests/test_sec_axes.py"
      - ".github/workflows/release_notes.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  release-notes-verify:
    name: Verify Release Notes Generator & Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Release Notes Generator
        run: |
          pytest tests/test_sec_axes.py -k "test_t_rel_1703_automated_release_notes_generator" -v -o addopts=""
