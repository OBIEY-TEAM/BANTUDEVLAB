name: Sovereign Organization Teams & Roles CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "docs/SOVEREIGN_ORG_ROLES.md"
      - "custom/public/assets/css/**"
      - "tests/test_sec_axes.py"
      - ".github/workflows/org_teams.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  org-teams-verify:
    name: Verify Organization Teams & Role Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Organization Roles
        run: |
          pytest tests/test_sec_axes.py -k "test_t_org_2201_and_2202_organization_roles_matrix" -v -o addopts=""
