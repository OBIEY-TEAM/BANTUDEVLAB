name: Sovereign PR Suggested Changes CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "custom/public/assets/css/**"
      - "custom/templates/custom/header.tmpl"
      - "tests/test_ui_axes.py"
      - ".github/workflows/suggested_changes.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  suggested-changes-verify:
    name: Verify PR Suggested Changes Formatting & Polyfill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup BantuDevLab Environment
        uses: ./.github/actions/setup-bantudevlab
        with:
          python-version: "3.11"
      - name: Test Suggested Changes Widget
        run: |
          pytest tests/test_ui_axes.py -k "test_t_sug_1901_and_1902_pr_suggested_changes" -v -o addopts=""
