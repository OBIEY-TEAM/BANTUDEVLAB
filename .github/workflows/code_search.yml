name: Sovereign Advanced Code Search CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "docs/SOVEREIGN_CODE_SEARCH.md"
      - "custom/public/assets/css/**"
      - "custom/templates/custom/header.tmpl"
      - "tests/test_ui_axes.py"
      - ".github/workflows/code_search.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  code-search-verify:
    name: Verify Code Search Qualifiers & UI Helpers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django celery python-dotenv drf-spectacular

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Code Search Qualifiers
        run: |
          pytest tests/test_ui_axes.py -k "test_t_src_1801_and_1802_code_search_qualifiers_and_docs" -v -o addopts=""
