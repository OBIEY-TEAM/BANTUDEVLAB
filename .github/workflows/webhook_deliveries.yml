name: Sovereign Webhook Delivery & Redelivery CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "apps/gitea_client/**"
      - "tests/test_gitea_client.py"
      - ".github/workflows/webhook_deliveries.yml"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  webhook-verify:
    name: Verify Webhook Delivery & Redeliver Simulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Webhook Redelivery
        run: |
          pytest tests/test_gitea_client.py -k "webhook_redeliver" -v -o addopts=""
