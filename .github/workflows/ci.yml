name: BantuDevLab Sovereign CI/CD Pipeline

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint_and_security:
    name: Linting & Sécurité Statique (Ruff & Bandit - QA-04)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Ruff Linter & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Bandit Static Application Security Testing
        run: |
          bandit -c pyproject.toml -r apps config

  test:
    name: Tests Unitaires, Fuzzing & Couverture Stricte (QA-01, QA-02, QA-03)
    needs: lint_and_security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Django System Checks
        run: |
          python manage.py check

      - name: Run Pytest Suite with Strict Coverage (> 95% QA-03)
        run: |
          pytest --cov=apps/zkp_auth --cov=apps/security_scanner --cov=apps/ai_assistant --cov-report=term-missing --cov-fail-under=95

      - name: Run Django Test Suite
        run: |
          python manage.py test tests -v 2

      - name: Verify Finetuning Pipeline Integrity
        run: |
          python -m py_compile finetuning/dataset_preparation.py finetuning/train_lora.py finetuning/evaluate.py finetuning/export_gguf.py
          python finetuning/dataset_preparation.py
          python finetuning/train_lora.py --dry_run
          python finetuning/evaluate.py
          python finetuning/export_gguf.py --dry_run

      - name: Validate Docker Compose Configuration
        run: |
          docker compose --env-file .env.example config --quiet

  docker_build:
    name: Build & Verify Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Django Core Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bantudevlab/core:latest
