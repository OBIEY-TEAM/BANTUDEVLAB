name: BantuDevLab Sovereign CI/CD Pipeline

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Tests Unitaires & Intégration Souveraine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Checks
        run: |
          python manage.py check

      - name: Run Automated Test Suite
        run: |
          python manage.py test tests -v 2

      - name: Verify Finetuning Pipeline Integrity
        run: |
          python -m py_compile finetuning/dataset_preparation.py finetuning/train_lora.py finetuning/evaluate.py
          python finetuning/dataset_preparation.py
          python finetuning/train_lora.py --dry_run
          python finetuning/evaluate.py

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

  docker_build:
    name: Build & Verify Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Django Core Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bantudevlab/core:latest
