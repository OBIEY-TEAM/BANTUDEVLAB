name: Sovereign PR Suggested Changes CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "custom/public/assets/css/**"
      - "custom/templates/custom/header.tmpl"
      - "tests/test_ui_axes.py"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  suggested-changes-verify:
    name: Verify PR Suggested Changes Formatting & Polyfill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Suggested Changes Widget
        run: |
          pytest tests/test_ui_axes.py -k "test_t_sug_1901_and_1902_pr_suggested_changes" -v -o addopts=""
