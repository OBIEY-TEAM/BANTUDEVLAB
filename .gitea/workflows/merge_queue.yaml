name: Sovereign Merge Queue CI

on:
  push:
    branches: [ "main", "develop*", "feature/*" ]
    paths:
      - "scripts/simulate_merge_queue.py"
      - "docs/SOVEREIGN_MERGE_QUEUE.md"
      - "custom/public/assets/css/**"
      - "tests/test_sec_axes.py"
  pull_request:
    branches: [ "main", "develop*" ]

jobs:
  merge-queue-verify:
    name: Verify Merge Queue Simulation & Styles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework requests pytest pytest-django

      - name: Verify Zero Emoji Policy
        run: |
          python scripts/check_no_emoji.py

      - name: Test Merge Queue Simulation
        run: |
          pytest tests/test_sec_axes.py -k "test_t_mrg_2401_and_2402_merge_queue_simulation" -v -o addopts=""
