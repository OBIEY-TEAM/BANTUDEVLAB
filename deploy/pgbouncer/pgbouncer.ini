[databases]
bantudevlab = host=db port=5432 dbname=bantudevlab auth_user=bantudevlab_admin
bantudevlab_prod = host=db port=5432 dbname=bantudevlab_prod auth_user=bantudevlab_admin
* = host=db port=5432 auth_user=bantudevlab_admin

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /tmp/userlist.txt
admin_users = bantudevlab_admin
stats_users = bantudevlab_monitor
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 500
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
