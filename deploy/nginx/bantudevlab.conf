# Configuration Nginx Interne BANTUDEVLAB (Proxy Docker)

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=git_limit:10m rate=50r/s;

# 1. Portail Principal & API REST (Django)
server {
    listen 80;
    server_name cybersocle.site bantudevlab.africa api.bantudevlab.africa auth.bantudevlab.africa;

    client_max_body_size 500M;

    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Ssl on;
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://django_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 2. Forge Git (GitLab)
server {
    listen 80;
    server_name git.cybersocle.site git.bantudevlab.africa;

    client_max_body_size 250M;

    location / {
        limit_req zone=git_limit burst=50 nodelay;
        proxy_pass http://gitlab:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
