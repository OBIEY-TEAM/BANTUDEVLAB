# Configuration Nginx Interne BANTUDEVLAB (Proxy Docker & Production)
# Resolution DNS Docker dynamique pour demarrer meme si un conteneur optionnel (ex: gitlab, ollama) est arrete

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=git_limit:10m rate=50r/s;

# 1. Portail Principal & API REST (Django)
server {
    listen 80 default_server;
    server_name cybersocle.site www.cybersocle.site api.cybersocle.site auth.cybersocle.site auth.bantudevlab.africa localhost 127.0.0.1;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 500M;

    # Fichiers statiques Django
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Sondes de sante directes sans redirection
    location ~ ^/(health|healthz|readyz)/?$ {
        # proxy_pass http://django_app:8000;
        set $django_upstream http://django_app:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    location / {
        limit_req zone=api_limit burst=30 nodelay;
        # proxy_pass http://django_app:8000;
        set $django_upstream http://django_app:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 120s;
    }
}

# 2. Forge Git Souveraine Gitea rattachee a https://git.cybersocle.site/
server {
    listen 80;
    server_name git.cybersocle.site gitea.cybersocle.site;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 250M;

    # Fichiers statiques BantuDevLab (Terminal Souverain & Sync Ecosysteme) sur git.cybersocle.site
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /assets/js/bantu-command-terminal.js {
        alias /var/www/static/js/bantu-command-terminal.js;
        expires 1h;
    }

    location = /assets/js/bantu-ecosystem-sync.js {
        alias /var/www/static/js/bantu-ecosystem-sync.js;
        expires 1h;
    }

    # Passerelle directe Copilot IA / Gemma 2 2B / SAST / Repo Explorer depuis Gitea (meme origine)
    location ~ ^/api/(ai|security|forge)/ {
        # proxy_pass http://django_app:8000;
        set $django_upstream http://django_app:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 120s;
    }

    location ~ ^/(health|healthz|readyz|api/healthz)/?$ {
        # proxy_pass http://gitea:3000;
        set $gitea_upstream http://gitea:3000;
        proxy_pass $gitea_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Redirection des URLs navigateur se terminant par .git vers la page web du depot Gitea (evite les 404)
    location ~ ^/([^/]+)/([^/]+)\.git$ {
        return 301 https://$host/$1/$2$is_args$args;
    }

    location / {
        limit_req zone=git_limit burst=50 nodelay;
        # proxy_pass http://gitea:3000;
        set $gitea_upstream http://gitea:3000;
        proxy_pass $gitea_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script src="/static/js/bantu-ecosystem-sync.js"></script><script src="/static/js/bantu-command-terminal.js" defer></script></head>';
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# 3. Passerelle GitLab CE Omnibus (gitlab.cybersocle.site / git.bantudevlab.africa)
server {
    listen 80;
    server_name gitlab.cybersocle.site git.bantudevlab.africa;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 250M;

    location ~ ^/(health|healthz|readyz)/?$ {
        # proxy_pass http://gitlab:80;
        set $gitlab_upstream http://gitlab:80;
        proxy_pass $gitlab_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Redirection des URLs navigateur se terminant par .git vers la page web du depot Gitea (evite les 404)
    location ~ ^/([^/]+)/([^/]+)\.git$ {
        return 301 https://$host/$1/$2$is_args$args;
    }

    location / {
        limit_req zone=git_limit burst=50 nodelay;
        # proxy_pass http://gitlab:80;
        set $gitlab_upstream http://gitlab:80;
        proxy_pass $gitlab_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# 4. Moteur Forge Interne (forge.cybersocle.site -> redirection vers git.cybersocle.site)
server {
    listen 80;
    server_name forge.cybersocle.site;

    location / {
        return 301 https://git.cybersocle.site$request_uri;
    }
}

# 5. Passerelle IA / Gemma LLM (ai.cybersocle.site)
server {
    listen 80;
    server_name ai.cybersocle.site;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50M;

    location / {
        # proxy_pass http://ollama:11434;
        set $ollama_upstream http://ollama:11434;
        proxy_pass $ollama_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 300s;
    }
}
