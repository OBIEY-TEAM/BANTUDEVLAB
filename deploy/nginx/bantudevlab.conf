# Configuration Nginx Haute Performance BANTUDEVLAB (Systalink Cloud)
# Terminaison TLS 1.3 stricte, HSTS, CSP durcie et proxy inverse securise

# Zone de limitation de debit (Rate Limiting anti-DDoS)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=git_limit:10m rate=50r/s;

# Redirection globale HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cybersocle.site www.cybersocle.site git.cybersocle.site api.cybersocle.site gitea.cybersocle.site forge.cybersocle.site ai.cybersocle.site bantudevlab.africa git.bantudevlab.africa api.bantudevlab.africa auth.bantudevlab.africa;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthchecks non rediriges en HTTPS pour les sondes internes de monitoring
    location ~ ^/(health|healthz|readyz)/?$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. Portail Principal & API REST (cybersocle.site, api.cybersocle.site, bantudevlab.africa)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cybersocle.site www.cybersocle.site api.cybersocle.site bantudevlab.africa api.bantudevlab.africa auth.bantudevlab.africa;

    ssl_certificate /etc/letsencrypt/live/cybersocle.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybersocle.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # En-tetes de securite stricts
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com; frame-ancestors 'none';" always;

    # Fichiers Statiques avec mise en cache navigateur 30 jours
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Sondes de sante directes
    location ~ ^/(health|healthz|readyz)/?$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Proxy vers Django ASGI / Gunicorn
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 120s;
    }
}

# 2. Forge Git Souveraine (git.cybersocle.site, git.bantudevlab.africa)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name git.cybersocle.site git.bantudevlab.africa;

    ssl_certificate /etc/letsencrypt/live/cybersocle.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybersocle.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 250M;

    # Sondes de sante pour la Forge sans redirection
    location ~ ^/(health|healthz|readyz)/?$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    location / {
        limit_req zone=git_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

