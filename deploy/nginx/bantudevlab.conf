# Configuration Nginx Haute Performance BANTUDEVLAB (Systalink Cloud)
# Terminaison TLS 1.3 stricte, HSTS, CSP durcie et proxy inverse securise

# Zone de limitation de debit (Rate Limiting anti-DDoS)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=git_limit:10m rate=50r/s;

# Redirection globale HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bantudevlab.africa git.bantudevlab.africa api.bantudevlab.africa auth.bantudevlab.africa;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. Portail Principal & API REST (bantudevlab.africa, api.bantudevlab.africa & auth.bantudevlab.africa)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bantudevlab.africa api.bantudevlab.africa auth.bantudevlab.africa;

    ssl_certificate /etc/letsencrypt/live/bantudevlab.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bantudevlab.africa/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # En-tetes de securite stricts
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;

    # Fichiers Statiques avec mise en cache navigateur 30 jours (aligne sur le volume static_volume:/var/www/static)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Proxy vers Django ASGI / Gunicorn sur le reseau app_net
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://django_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# 2. Forge Git Souveraine (git.bantudevlab.africa)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name git.bantudevlab.africa;

    ssl_certificate /etc/letsencrypt/live/bantudevlab.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bantudevlab.africa/privkey.pem;
    ssl_protocols TLSv1.3;

    client_max_body_size 250M;

    # Proxy vers GitLab Omnibus CE sur le reseau app_net
    location / {
        limit_req zone=git_limit burst=50 nodelay;
        proxy_pass http://gitlab:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
