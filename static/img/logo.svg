<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="africaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="africaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle badge -->
  <rect width="120" height="120" rx="24" fill="#090d16" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Stylized Africa Continent Silhouette -->
  <path d="M 42 18 
           Q 62 10 82 17 
           Q 104 27 98 44 
           Q 90 49 92 59 
           Q 100 66 97 78 
           Q 84 94 71 103 
           Q 60 101 56 90 
           Q 50 82 43 73 
           Q 33 61 29 55 
           Q 18 49 20 38 
           Q 24 28 42 18 Z" 
        fill="url(#africaGradient)" 
        filter="url(#africaGlow)" 
        stroke="#ffffff" 
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Network Interconnection Nodes (Abidjan, Dakar, Lagos, Kigali, Nairobi) -->
  <g stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" opacity="0.8">
    <line x1="36" y1="48" x2="26" y2="42" />
    <line x1="36" y1="48" x2="56" y2="54" />
    <line x1="56" y1="54" x2="78" y2="65" />
    <line x1="78" y1="65" x2="88" y2="61" />
  </g>

  <!-- Node points -->
  <circle cx="26" cy="42" r="3" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/> <!-- Dakar -->
  <circle cx="36" cy="48" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/> <!-- Abidjan -->
  <circle cx="56" cy="54" r="3" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/> <!-- Lagos -->
  <circle cx="78" cy="65" r="3" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/> <!-- Kigali -->
  <circle cx="88" cy="61" r="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/> <!-- Nairobi -->
</svg>
